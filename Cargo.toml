[workspace]
resolver = '3'
members = [ "archidekt-provider", "moxfield-provider", "models", "provider","rocket-app", "scryfall"]
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0.145"
models = {path = "models"}
scryfall= {path = "scryfall"}
provider = {path = "provider"}
archidekt-provider = {path = "archidekt-provider"}
moxfield-provider = {path = "moxfield-provider"}
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
# Prefer faster deploy builds over minimum binary size.
opt-level = 2
lto = "thin"
codegen-units = 16